name: Build

on:
  pull_request: {}
  # The merge queue needs `build` to report on the queue ref.
  # merge_group alone was not dispatching, so mirror the
  # push-on-queue-ref trigger the review workflows already use.
  push:
    branches:
      - gh-readonly-queue/**
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: p6m7g8-actions/p6-repo-build@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
